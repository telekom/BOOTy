name: Use baseline glibc for static builds
description: >-
  Reinstall libc6-dev and libgcc from the baseline amd64 archive. Ubuntu 26.04 runners
  enable apt architecture variants, so the preinstalled C runtime is the
  amd64v3 build, which uses AVX2. A BOOTy binary linked statically
  against it dies with SIGILL on CPUs below x86-64-v3 (older servers,
  hypervisors exposing a baseline CPU model, QEMU's default qemu64 CPU).

runs:
  using: composite
  steps:
    - name: Reinstall baseline libc6-dev and libgcc
      shell: bash
      run: |
        set -euo pipefail
        [ "$(dpkg --print-architecture)" = amd64 ] || exit 0
        apt-config dump | grep -F 'APT::Architecture-Variants' || true
        # The image lists the variants, so `-o APT::Architecture-Variants=`
        # cannot clear them; a #clear directive can. Only refresh the Ubuntu
        # archive, so optional third-party sources cannot fail this step.
        conf="$RUNNER_TEMP/apt-no-variants.conf"
        printf '#clear APT::Architecture-Variants;\n' >"$conf"
        apt_opts=(
          -c "$conf"
          -o Dir::Etc::SourceList=/etc/apt/sources.list.d/ubuntu.sources
          -o Dir::Etc::SourceParts=-
          -o Acquire::Retries=3
          -o Debug::Acquire::Variants=true
        )
        # Static links take crt*.o and libc.a from libc6-dev, and libgcc.a
        # and crtbeginT.o from the libgcc dev package of the default gcc.
        libgcc_pkg=$(dpkg -S "$(gcc -print-libgcc-file-name)" | cut -d: -f1)
        sudo apt-get "${apt_opts[@]}" update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y -qq \
          --reinstall --no-install-recommends libc6-dev "$libgcc_pkg"
