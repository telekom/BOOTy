name: PR Artifact Publishing

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pr-artifacts-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-pr-iso:
    name: Publish PR BOOTy GoBGP ISO
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build GoBGP ISO artifact
        run: |
          docker buildx build --platform linux/amd64 --target gobgp-iso \
            --output type=local,dest=out-gobgp-iso -f initrd.Dockerfile .

          test -f out-gobgp-iso/booty-gobgp.iso
          sha256sum out-gobgp-iso/booty-gobgp.iso > out-gobgp-iso/booty-gobgp.iso.sha256

      - name: Publish artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: booty-gobgp-pr-iso
          path: |
            out-gobgp-iso/booty-gobgp.iso
            out-gobgp-iso/booty-gobgp.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitLab generic package
        env:
          GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
          GITLAB_API_V4_URL: ${{ vars.GITLAB_API_V4_URL || 'https://gitlab.devops.telekom.de/api/v4' }}
          GITLAB_PACKAGE_PROJECT_ID: ${{ vars.GITLAB_PACKAGE_PROJECT_ID || '278324' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_PACKAGE_TOKEN}" ]; then
            echo "GITLAB_PACKAGE_TOKEN is not configured; skipping GitLab package publish."
            exit 0
          fi

          version="${HEAD_SHA:0:7}"
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("out-gobgp-iso")
          with zipfile.ZipFile("booty-gobgp-pr-iso.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for name in ("booty-gobgp.iso", "booty-gobgp.iso.sha256"):
                  archive.write(root / name, name)
          PY
          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_PACKAGE_TOKEN}" \
            --upload-file booty-gobgp-pr-iso.zip \
            "${GITLAB_API_V4_URL}/projects/${GITLAB_PACKAGE_PROJECT_ID}/packages/generic/booty-pr-artifacts/${version}/booty-gobgp-pr-iso.zip"

      - name: Print download hint
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          ENCODED_REF=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['REF_NAME'], safe=''))")
          echo "nightly.link URL (latest artifact on branch):"
          echo "https://nightly.link/${{ github.repository }}/workflows/pr-artifacts.yml/${ENCODED_REF}/booty-gobgp-pr-iso.zip"
