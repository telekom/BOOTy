name: PR Artifact Publishing

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-artifacts-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-pr-iso:
    name: Publish PR BOOTy GoBGP ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Explain fork PR artifact policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### PR ISO artifact"
            echo
            echo "Skipped: PR ISO artifact publishing is disabled for fork pull requests."
            echo "Fork PRs are still validated by the regular CI workflows, but BOOTy does not publish bootable ISO artifacts from untrusted fork heads."
            echo
            echo "For trusted artifact publication, push the branch in this repository or run this workflow manually from a reviewed ref."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build GoBGP ISO artifact
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --target gobgp-iso \
            --output type=local,dest=out-gobgp-iso -f initrd.Dockerfile .

          test -f out-gobgp-iso/booty-gobgp.iso
          max_iso_bytes=$((140 * 1024 * 1024))
          iso_bytes=$(stat -c%s "out-gobgp-iso/booty-gobgp.iso")
          echo "GoBGP ISO size: $(numfmt --to=iec "$iso_bytes")"
          if [ "$iso_bytes" -gt "$max_iso_bytes" ]; then
            echo "::error::GoBGP ISO is $(numfmt --to=iec "$iso_bytes"), above hard cap $(numfmt --to=iec "$max_iso_bytes")"
            exit 1
          fi
          sha256sum out-gobgp-iso/booty-gobgp.iso > out-gobgp-iso/booty-gobgp.iso.sha256
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib

          iso = pathlib.Path("out-gobgp-iso/booty-gobgp.iso")
          document = {
              "artifact": "booty-gobgp-pr-iso",
              "head_sha": os.environ["HEAD_SHA"],
              "github_sha": os.environ["MERGE_SHA"],
              "checked_out_sha": os.popen("git rev-parse HEAD").read().strip(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "iso": {
                  "name": iso.name,
                  "sha256": hashlib.sha256(iso.read_bytes()).hexdigest(),
                  "size": iso.stat().st_size,
              },
          }
          pathlib.Path("out-gobgp-iso/booty-pr-artifact.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Package GitLab generic artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import zipfile

          root = pathlib.Path("out-gobgp-iso")
          archive_path = pathlib.Path("booty-gobgp-pr-iso.zip")
          artifact_names = (
              "booty-gobgp.iso",
              "booty-gobgp.iso.sha256",
              "booty-pr-artifact.json",
          )

          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for name in artifact_names:
                  artifact = root / name
                  if not artifact.is_file() or artifact.is_symlink():
                      raise SystemExit(f"{artifact} must be a regular non-symlink file")
                  archive.write(artifact, name)
          PY

      - name: Publish artifact
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: booty-gobgp-pr-iso
          path: |
            out-gobgp-iso/booty-gobgp.iso
            out-gobgp-iso/booty-gobgp.iso.sha256
            out-gobgp-iso/booty-pr-artifact.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitLab generic package
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
          GITLAB_PACKAGE_REQUIRED: ${{ vars.GITLAB_PACKAGE_REQUIRED || 'false' }}
          GITLAB_API_V4_URL: ${{ vars.GITLAB_API_V4_URL || 'https://gitlab.devops.telekom.de/api/v4' }}
          GITLAB_PACKAGE_PROJECT_ID: ${{ vars.GITLAB_PACKAGE_PROJECT_ID || '278324' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          version="${HEAD_SHA:0:7}"
          package_url="${GITLAB_API_V4_URL}/projects/${GITLAB_PACKAGE_PROJECT_ID}/packages/generic/booty-pr-artifacts/${version}/booty-gobgp-pr-iso.zip"
          required="$(printf '%s' "${GITLAB_PACKAGE_REQUIRED}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${GITLAB_PACKAGE_TOKEN}" ]; then
            if [ "${required}" = "true" ] || [ "${required}" = "1" ] || [ "${required}" = "yes" ]; then
              echo "::error::GITLAB_PACKAGE_REQUIRED is true, but GITLAB_PACKAGE_TOKEN is not configured."
              exit 1
            fi
            echo "::notice::GITLAB_PACKAGE_TOKEN is not configured; GitLab generic package publish is optional and was skipped."
            {
              echo "### GitLab generic package"
              echo
              echo "Skipped: \`GITLAB_PACKAGE_TOKEN\` is not configured."
              echo "Set repository variable \`GITLAB_PACKAGE_REQUIRED=true\` to make this a required publishing target."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_PACKAGE_TOKEN}" \
            --upload-file booty-gobgp-pr-iso.zip \
            "${package_url}"
          {
            echo "### GitLab generic package"
            echo
            echo "Published: \`${package_url}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Note GitLab package publish scope
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### GitLab generic package"
            echo
            echo "Skipped for pull requests; run this workflow manually to publish a GitLab package."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Note GitLab package publish ref guard
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          {
            echo "### GitLab generic package"
            echo
            echo "Skipped: GitLab package publishing is only available when this workflow is dispatched from the default branch."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Print download hint
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          ENCODED_REF=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['REF_NAME'], safe=''))")
          echo "nightly.link URL (latest artifact on branch):"
          echo "https://nightly.link/${{ github.repository }}/workflows/pr-artifacts.yml/${ENCODED_REF}/booty-gobgp-pr-iso.zip"
