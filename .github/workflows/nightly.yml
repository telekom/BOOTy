name: Nightly Build

on:
  schedule:
    - cron: "0 2 * * *" # 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - id: version
        run: |
          BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          if ! printf '%s\n' "${BASE}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::latest tag ${BASE} is not a valid release version"
            exit 1
          fi
          printf 'version=%s-nightly.%s.%s.%s\n' "${BASE}" "$(date +%Y%m%d)" "${GITHUB_RUN_NUMBER}" "${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }}/${{ matrix.flavor }})
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64]
        flavor: [default, gobgp, slim, micro]
      fail-fast: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build binary
        if: matrix.flavor == 'default'
        env:
          NIGHTLY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} CC=gcc \
            go build -ldflags "-s -w \
              -X main.Version=${NIGHTLY_VERSION} \
              -X main.Build=$(date -u +%Y%m%dT%H%M%S) \
              -linkmode external -extldflags '-static'" \
            -o booty-${{ matrix.arch }}

      - name: Build initramfs (${{ matrix.flavor }})
        env:
          NIGHTLY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          BUILD_FLAVOR="${{ matrix.flavor }}"
          if [ "${BUILD_FLAVOR}" = "default" ]; then
            BUILD_FLAVOR="full"
          fi
          TARGET_ARG=""
          if [ "${{ matrix.flavor }}" != "default" ]; then
            TARGET_ARG="--target=${{ matrix.flavor }}"
          fi
          docker buildx build --platform linux/${{ matrix.arch }} \
            ${TARGET_ARG} \
            --build-arg "BOOTY_VERSION=${NIGHTLY_VERSION}" \
            --build-arg "BOOTY_BUILD=${{ github.sha }}" \
            --build-arg "BOOTY_FLAVOR=${BUILD_FLAVOR}" \
            --output type=local,dest=out-${{ matrix.flavor }} \
            -f initrd.Dockerfile .

      - name: Verify initramfs output
        run: |
          case "${{ matrix.flavor }}" in
            micro)
              test -f "out-${{ matrix.flavor }}/initramfs.cpio.gz"
              ;;
            default|gobgp|slim)
              test -f "out-${{ matrix.flavor }}/initramfs.cpio.zst"
              ;;
            *)
              echo "unknown flavor ${{ matrix.flavor }}" >&2
              exit 1
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nightly-${{ matrix.flavor }}-${{ matrix.arch }}
          path: |
            booty-${{ matrix.arch }}
            out-${{ matrix.flavor }}/initramfs.cpio.gz
            out-${{ matrix.flavor }}/initramfs.cpio.zst
          if-no-files-found: error
          retention-days: 14

  scan:
    name: Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Download nightly artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: nightly-*
          path: nightly-artifacts
          merge-multiple: false

      - name: Install scan extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip zstd

      - name: Extract initramfs artifacts
        run: bash hack/extract-initramfs-artifacts.sh nightly-artifacts scan-rootfs

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: scan-rootfs
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
          format: table

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: spdx-json
          output-file: sbom-nightly.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom-nightly
          path: sbom-nightly.spdx.json
          if-no-files-found: error
          retention-days: 14

  container:
    name: Nightly Container Image
    needs: [version, build, scan, sbom]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: sbom-nightly
          path: sbom

      - name: Build and push nightly container image
        id: push
        env:
          NIGHTLY_VERSION: ${{ needs.version.outputs.version }}
        run: |
          IMAGE_REPO="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          IMAGE="${IMAGE_REPO}:${NIGHTLY_VERSION}"
          docker buildx build --platform linux/amd64 \
            --build-arg "BOOTY_VERSION=${NIGHTLY_VERSION}" \
            --build-arg "BOOTY_BUILD=${{ github.sha }}" \
            --build-arg "BOOTY_FLAVOR=full" \
            --provenance=true \
            --push \
            -t "${IMAGE}" \
            --metadata-file image-metadata.json \
            -f initrd.Dockerfile .
          DIGEST="$(jq -r '."containerimage.digest"' image-metadata.json)"
          if [ -z "${DIGEST}" ] || [ "${DIGEST}" = "null" ]; then
            echo "::error::docker buildx did not report a pushed image digest"
            cat image-metadata.json
            exit 1
          fi
          printf 'image_ref=%s@%s\n' "${IMAGE_REPO}" "${DIGEST}" >> "${GITHUB_OUTPUT}"
          printf 'image_tag=%s\n' "${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Sign nightly container image
        run: |
          cosign sign --yes "${{ steps.push.outputs.image_ref }}"
          cosign verify \
            --certificate-identity "${{ github.server_url }}/${{ github.repository }}/.github/workflows/nightly.yml@${{ github.ref }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.push.outputs.image_ref }}"

      - name: Attach SBOM attestation
        run: |
          test -s sbom/sbom-nightly.spdx.json
          cosign attest --yes \
            --predicate sbom/sbom-nightly.spdx.json \
            --type spdx \
            "${{ steps.push.outputs.image_ref }}"
