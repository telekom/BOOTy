name: Release v2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - id: meta
        name: Validate tag and release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ "${VERSION}" = "${TAG}" ]; then
            echo "::error::release tag ${TAG} is not valid semver"
            exit 1
          fi

          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s\n' "${VERSION}" | grep -Eq "${SEMVER_RE}"; then
            echo "::error::release tag ${TAG} is not valid semver"
            exit 1
          fi

          ref_json=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}") || {
              echo "::error::could not inspect release tag ${TAG}"
              exit 1
            }
          ref_type=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])' <<<"${ref_json}")
          if [ "${ref_type}" != "tag" ]; then
            echo "::error::release tag ${TAG} must be an annotated tag, got Git object type ${ref_type}"
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || true)
          case "${status}" in
            200)
              echo "::error::release ${TAG} already exists; refusing to overwrite published assets"
              exit 1
              ;;
            404)
              ;;
            *)
              echo "::error::could not verify release ${TAG} existence, GitHub API status ${status}"
              exit 1
              ;;
          esac

          BASE_VERSION="${VERSION%%+*}"
          if printf '%s\n' "${BASE_VERSION}" | grep -q -- '-'; then
            printf 'prerelease=true\n' >> "${GITHUB_OUTPUT}"
            printf 'make_latest=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'prerelease=false\n' >> "${GITHUB_OUTPUT}"
            printf 'make_latest=true\n' >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build (${{ matrix.arch }}/${{ matrix.flavor }})
    needs: validate-tag
    strategy:
      matrix:
        include:
          - arch: amd64
            flavor: default
            runner: ubuntu-latest
          - arch: amd64
            flavor: gobgp
            runner: ubuntu-latest
          - arch: amd64
            flavor: slim
            runner: ubuntu-latest
          - arch: amd64
            flavor: micro
            runner: ubuntu-latest
          - arch: arm64
            flavor: default
            runner: ubuntu-24.04-arm
          - arch: arm64
            flavor: gobgp
            runner: ubuntu-24.04-arm
          - arch: arm64
            flavor: slim
            runner: ubuntu-24.04-arm
          - arch: arm64
            flavor: micro
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Assert runner architecture
        run: |
          RUNNER_ARCH="$(uname -m)"
          case "${RUNNER_ARCH}" in
            x86_64)  EXPECTED="amd64" ;;
            aarch64) EXPECTED="arm64" ;;
            *)
              echo "::error::unsupported runner architecture: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          if [ "${EXPECTED}" != "${{ matrix.arch }}" ]; then
            echo "::error::runner architecture ${EXPECTED} does not match matrix.arch ${{ matrix.arch }}"
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.26"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build binary
        if: matrix.flavor == 'default'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} CC=gcc \
            go build -trimpath -ldflags "-s -w \
              -X main.Version=${VERSION} \
              -X main.Build=${{ github.sha }} \
              -linkmode external -extldflags '-static'" \
            -o booty-${{ matrix.arch }}

      - name: Build initramfs (${{ matrix.flavor }})
        run: |
          TARGET_ARG=""
          if [ "${{ matrix.flavor }}" != "default" ]; then
            TARGET_ARG="--target=${{ matrix.flavor }}"
          fi
          docker buildx build \
            ${TARGET_ARG} \
            --platform linux/${{ matrix.arch }} \
            --output type=local,dest=out-${{ matrix.flavor }} \
            -f initrd.Dockerfile .

      - name: Generate checksums
        run: |
          if [ -f booty-${{ matrix.arch }} ]; then
            sha256sum booty-${{ matrix.arch }} > booty-${{ matrix.arch }}.sha256
          fi
          if [ -f out-${{ matrix.flavor }}/initramfs.cpio.zst ]; then
            cp out-${{ matrix.flavor }}/initramfs.cpio.zst ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst
            sha256sum ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst > ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst.sha256
          elif [ -f out-${{ matrix.flavor }}/initramfs.cpio.gz ]; then
            cp out-${{ matrix.flavor }}/initramfs.cpio.gz ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz
            sha256sum ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz > ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz.sha256
          else
            echo "::error::missing initramfs output for ${{ matrix.flavor }}/${{ matrix.arch }}"
            find out-${{ matrix.flavor }} -maxdepth 2 -type f -print || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.flavor }}-${{ matrix.arch }}
          path: |
            booty-${{ matrix.arch }}
            booty-${{ matrix.arch }}.sha256
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz.sha256
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst.sha256
          if-no-files-found: ignore

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: sbom.spdx.json

  scan:
    name: Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  sign:
    name: Sign Artifacts
    needs: [build, iso, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Sign checksums with Cosign
        run: |
          for f in $(find artifacts -name "*.sha256"); do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --bundle "${f}.bundle" \
              "$f"
          done

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signatures
          path: |
            artifacts/**/*.sig
            artifacts/**/*.bundle

  container:
    name: Container Image (${{ matrix.flavor }}/${{ matrix.arch }})
    needs: [build, scan]
    strategy:
      matrix:
        include:
          - flavor: default
            arch: amd64
            runner: ubuntu-latest
          - flavor: default
            arch: arm64
            runner: ubuntu-24.04-arm
          - flavor: gobgp
            arch: amd64
            runner: ubuntu-latest
          - flavor: gobgp
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          TARGET_ARG=""
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            TARGET_ARG="--target=gobgp"
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx build \
            ${TARGET_ARG} \
            --platform "linux/${{ matrix.arch }}" \
            --provenance=true \
            --push \
            -t "${IMAGE}:${IMAGE_TAG}-${{ matrix.arch }}" \
            -f initrd.Dockerfile .

  container-manifest:
    name: Container Manifest (${{ matrix.flavor }})
    needs: container
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor: [default, gobgp]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Create and push multi-arch manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t "${IMAGE}:${IMAGE_TAG}" \
            "${IMAGE}:${IMAGE_TAG}-amd64" \
            "${IMAGE}:${IMAGE_TAG}-arm64"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign container image
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${IMAGE_TAG}
          cosign sign --yes "${IMAGE}"

  iso:
    name: ISO (${{ matrix.flavor }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: default
            target: iso
            output: booty.iso
            artifact: booty-amd64.iso
          - flavor: gobgp
            target: gobgp-iso
            output: booty-gobgp.iso
            artifact: booty-gobgp-amd64.iso
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Build ISO
        run: |
          docker buildx build \
            --target ${{ matrix.target }} \
            --platform linux/amd64 \
            --output type=local,dest=out-iso \
            -f initrd.Dockerfile .
          mv out-iso/${{ matrix.output }} ${{ matrix.artifact }}

      - name: Generate checksums
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-iso-${{ matrix.flavor }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  iso-oci:
    name: ISO OCI (${{ matrix.flavor }})
    needs: [iso, scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: default
            artifact: booty-amd64.iso
            tag_suffix: ""
          - flavor: gobgp
            artifact: booty-gobgp-amd64.iso
            tag_suffix: "-gobgp"
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3
        with:
          version: "1.3.1"

      - name: Login to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ISO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-iso-${{ matrix.flavor }}

      - name: Push ISO as OCI artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}-iso" | tr '[:upper:]' '[:lower:]')
          REF="${REPO}:${VERSION}${{ matrix.tag_suffix }}"

          err="${RUNNER_TEMP}/oras-ref-check.err"
          if oras manifest fetch "${REF}" >/dev/null 2>"${err}"; then
            echo "::error::OCI artifact ${REF} already exists; refusing to overwrite"
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
            echo "::error::could not verify OCI artifact ${REF} is absent"
            cat "${err}" >&2 || true
            exit 1
          fi

          oras push "${REF}" \
            --artifact-type application/vnd.booty.iso.v1 \
            "${{ matrix.artifact }}:application/octet-stream"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign OCI artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}-iso" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${REPO}:${VERSION}${{ matrix.tag_suffix }}"

  changelog:
    name: Generate Changelog
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: changelog
          path: CHANGELOG.md

  release:
    name: Create GitHub Release
    needs: [validate-tag, build, iso, iso-oci, sbom, scan, sign, container-manifest, changelog, oci-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release-files
          find artifacts -type f \( -name "booty-*" -o -name "*.cpio.gz" -o -name "*.cpio.zst" -o -name "*.iso" -o -name "*.sha256" -o -name "*.sig" -o -name "*.bundle" -o -name "*.spdx.json" \) \
            -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b
        with:
          body_path: artifacts/changelog/CHANGELOG.md
          files: release-files/*
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          make_latest: ${{ needs.validate-tag.outputs.make_latest }}
          overwrite_files: false

  oci-artifacts:
    name: Publish OCI Artifacts (${{ matrix.arch }})
    needs: [build, sbom, sign, scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3
        with:
          version: "1.3.1"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Publish initramfs artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          ensure_oci_ref_absent() {
            local ref="$1"
            local err="${RUNNER_TEMP}/oras-ref-check.err"
            if oras manifest fetch "${ref}" >/dev/null 2>"${err}"; then
              echo "::error::OCI artifact ${ref} already exists; refusing to overwrite"
              exit 1
            fi
            if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
              echo "::error::could not verify OCI artifact ${ref} is absent"
              cat "${err}" >&2 || true
              exit 1
            fi
          }

          for flavor in default gobgp slim micro; do
            # gobgp, default, and slim use zstd compression; micro uses gzip.
            if [ "${flavor}" = "gobgp" ] || [ "${flavor}" = "default" ] || [ "${flavor}" = "slim" ]; then
              EXT="cpio.zst"
              MEDIA_TYPE="application/vnd.cncf.initramfs.layer.v1+zstd"
            else
              EXT="cpio.gz"
              MEDIA_TYPE="application/vnd.cncf.initramfs.layer.v1+gzip"
            fi
            INITRAMFS="artifacts/release-${flavor}-${{ matrix.arch }}/${flavor}-${{ matrix.arch }}-initramfs.${EXT}"
            CHECKSUM="artifacts/release-${flavor}-${{ matrix.arch }}/${flavor}-${{ matrix.arch }}-initramfs.${EXT}.sha256"

            if [ ! -f "${INITRAMFS}" ]; then
              echo "::error::missing initramfs artifact ${INITRAMFS}"
              exit 1
            fi
            if [ ! -f "${CHECKSUM}" ]; then
              echo "::error::missing initramfs checksum ${CHECKSUM}"
              exit 1
            fi

            TAG="${VERSION}-${flavor}-${{ matrix.arch }}"
            REF="${REPO}/initramfs:${TAG}"
            ensure_oci_ref_absent "${REF}"
            echo "Publishing ${REF}"

            ARGS="${INITRAMFS}:${MEDIA_TYPE} ${CHECKSUM}:text/plain"

            oras push "${REF}" \
              --annotation "org.opencontainers.image.title=BOOTy initramfs (${flavor}/${{ matrix.arch }})" \
              --annotation "org.opencontainers.image.version=${VERSION}" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --annotation "io.booty.flavor=${flavor}" \
              --annotation "io.booty.arch=${{ matrix.arch }}" \
              ${ARGS}
          done

      - name: Publish binary artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          BINARY="artifacts/release-default-${{ matrix.arch }}/booty-${{ matrix.arch }}"
          CHECKSUM="artifacts/release-default-${{ matrix.arch }}/booty-${{ matrix.arch }}.sha256"

          if [ ! -f "${BINARY}" ]; then
            echo "No binary found for ${{ matrix.arch }}, skipping"
            exit 0
          fi

          TAG="${VERSION}-${{ matrix.arch }}"
          REF="${REPO}/binary:${TAG}"

          err="${RUNNER_TEMP}/oras-ref-check.err"
          if oras manifest fetch "${REF}" >/dev/null 2>"${err}"; then
            echo "::error::OCI artifact ${REF} already exists; refusing to overwrite"
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
            echo "::error::could not verify OCI artifact ${REF} is absent"
            cat "${err}" >&2 || true
            exit 1
          fi

          echo "Publishing ${REF}"

          ARGS="${BINARY}:application/vnd.cncf.binary.layer.v1"
          if [ -f "${CHECKSUM}" ]; then
            ARGS="${ARGS} ${CHECKSUM}:text/plain"
          fi

          oras push "${REF}" \
            --annotation "org.opencontainers.image.title=BOOTy binary (${{ matrix.arch }})" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "io.booty.arch=${{ matrix.arch }}" \
            ${ARGS}

      - name: Publish SBOM artifact
        if: matrix.arch == 'amd64'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SBOM="artifacts/sbom/sbom.spdx.json"

          if [ ! -f "${SBOM}" ]; then
            echo "No SBOM found, skipping"
            exit 0
          fi

          REF="${REPO}/sbom:${VERSION}"
          err="${RUNNER_TEMP}/oras-ref-check.err"
          if oras manifest fetch "${REF}" >/dev/null 2>"${err}"; then
            echo "::error::OCI artifact ${REF} already exists; refusing to overwrite"
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
            echo "::error::could not verify OCI artifact ${REF} is absent"
            cat "${err}" >&2 || true
            exit 1
          fi

          echo "Publishing ${REF}"
          oras push "${REF}" \
            --annotation "org.opencontainers.image.title=BOOTy SBOM" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
