name: Promote Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g., v1.2.3-beta.1)"
        required: true
        type: string
      channel:
        description: "Target channel"
        required: true
        type: choice
        options:
          - beta
          - stable

permissions:
  contents: read

jobs:
  reject-non-default-ref:
    name: Reject non-default dispatch ref
    runs-on: ubuntu-latest
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - name: Reject promotion from non-default ref
        run: |
          echo "::error::Release promotion must be dispatched from refs/heads/${{ github.event.repository.default_branch }}; got ${GITHUB_REF}"
          exit 1

  promote:
    name: Promote ${{ inputs.version }} to ${{ inputs.channel }}
    runs-on: ubuntu-latest
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    environment: ${{ inputs.channel }}
    env:
      SOURCE_VERSION: ${{ inputs.version }}
      TARGET_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate promotion input
        run: |
          if ! [[ "$SOURCE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Invalid version tag: $SOURCE_VERSION"
            exit 1
          fi
          case "$TARGET_CHANNEL" in
            beta|stable) ;;
            *)
              echo "::error::Invalid promotion channel: $TARGET_CHANNEL"
              exit 1
              ;;
          esac
          if ! git fetch --no-tags origin "+refs/tags/${SOURCE_VERSION}:refs/tags/${SOURCE_VERSION}"; then
            echo "::error::Tag $SOURCE_VERSION does not exist"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${SOURCE_VERSION}" >/dev/null; then
            echo "::error::Tag $SOURCE_VERSION does not exist"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/${SOURCE_VERSION}")" != "tag" ]; then
            echo "::error::Tag $SOURCE_VERSION must be an annotated tag"
            exit 1
          fi
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          if ! SOURCE_COMMIT=$(git rev-list -n 1 "refs/tags/${SOURCE_VERSION}"); then
            echo "::error::Tag $SOURCE_VERSION does not resolve to a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_COMMIT" origin/main; then
            echo "::error::Tag $SOURCE_VERSION points to $SOURCE_COMMIT, which is not reachable from origin/main"
            exit 1
          fi

      - name: Determine new tag
        id: tag
        run: |
          BASE="${SOURCE_VERSION%%-*}"  # strip pre-release suffix
          case "$TARGET_CHANNEL" in
            beta)
              # Find next beta number
              LAST=$(git tag -l "${BASE}-beta.*" | sort -V | tail -1)
              if [ -z "$LAST" ]; then
                NUM=1
              elif [[ "$LAST" =~ \.([0-9]+)$ ]]; then
                NUM=$((BASH_REMATCH[1] + 1))
              else
                echo "::error::Existing beta tag has unexpected format: $LAST"
                exit 1
              fi
              printf 'tag=%s\n' "${BASE}-beta.${NUM}" >> "$GITHUB_OUTPUT"
              ;;
            stable)
              printf 'tag=%s\n' "${BASE}" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Create promoted tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "::error::Tag $NEW_TAG already exists"
            exit 1
          fi
          COMMIT=$(git rev-list -n 1 "$SOURCE_VERSION")
          git tag -a "$NEW_TAG" "$COMMIT" \
            -m "Promote $SOURCE_VERSION to $NEW_TAG" \
            -m "Source tag: $SOURCE_VERSION" \
            -m "Target channel: $TARGET_CHANNEL"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$NEW_TAG"

      - name: Summary
        run: |
          {
            echo "## Promotion Complete"
            echo "- Source: \`$SOURCE_VERSION\`"
            echo "- Target: \`${{ steps.tag.outputs.tag }}\` ($TARGET_CHANNEL)"
            echo "- The release-v2 workflow will now build artifacts for this tag."
          } >> "$GITHUB_STEP_SUMMARY"
