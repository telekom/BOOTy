version: 2
updates:
  # govulncheck for hack/check-govulncheck.py, pinned by a tool directive.
  - package-ecosystem: gomod
    directory: /hack/tools
    allow:
      - dependency-name: golang.org/x/vuln
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    groups:
      # In other repos Dependabot has raised security updates for tool-graph
      # modules that `allow` does not list (e.g. telekom/whereabouts#492).
      # Collect any such updates in govulncheck's graph in one PR.
      go-tools-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    allow:
      - dependency-type: all
    cooldown:
      default-days: 3
      semver-major-days: 14
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # go.mod replaces GoBGP with the fork tag v4.11.0-booty.5, so an
      # upstream bump would not change the build. Move the fork tag by hand:
      # docs/networking.md#gobgp-version-and-fork
      - dependency-name: github.com/osrg/gobgp/v4
      # Same for the gopacket, netlink and dhcp forks: docs/dependency-forks.md
      - dependency-name: github.com/gopacket/gopacket
      - dependency-name: github.com/vishvananda/netlink
      - dependency-name: github.com/insomniacslk/dhcp

  - package-ecosystem: docker
    # Dockerfile discovery is not recursive. List each independent context so
    # shared image updates can be grouped across the contexts that use them.
    directories:
      - /
      - /test/e2e/clab
      - /test/e2e/clab/vrnetlab
      # Lab images of the containerlab topologies, never built. Own directories
      # so their FROM lines do not merge with same-named images elsewhere:
      # test/e2e/clab/labimages/Dockerfile explains why.
      - /test/e2e/clab/labimages
      - /test/e2e/clab/labimages/frr-type5
      - /test/e2e/assets/busybox
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    ignore:
      # test/e2e/clab/networkd-test.Dockerfile pins one ubuntu image per LTS
      # release in standard support (22.04, 24.04, 26.04). Dependabot merges
      # these FROM lines into one ubuntu dependency with the version of the
      # first (22.04) and ignores every tag above it, so no line moves to
      # another release (25.10, 26.10); the digest of each pinned tag still
      # gets updates. A new LTS is added by hand as a new FROM line.
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # FRR major and minor releases change routing behaviour the lab
      # assertions depend on (Type-5 needs 10.3.2+, CONTRIBUTING.md) and are
      # moved by hand. Patch and digest updates of the lab FRR images still
      # come in. The dependency name omits the quay.io registry.
      - dependency-name: frrouting/frr
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      docker-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major
      docker-minor-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Digest-only updates have no SemVer increase. Handle updates left over
      # after the version groups together across all configured directories.
      docker-digests:
        group-by: dependency-name
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 3
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]
