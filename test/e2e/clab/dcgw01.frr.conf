! DCGW / Route Reflector FRR config for production-realistic E2E topology.
! Simulates a Data Center Gateway (AS 65188) providing iBGP route reflection
! and EVPN services, matching production's DCGW role.
!
!   eth1 → spine01 (eBGP, 10.0.1.2/30 ↔ 10.0.1.1/30, AS 65500)
!   eth2 → booty-prod (iBGP, 10.10.10.1/30 ↔ 10.10.10.2/30, AS 65188)
!
! In production: BOOTy peers with DCGWs at 10.10.10.1 and 10.10.10.2.
! This lab simulates one DCGW at 10.10.10.1.
!
frr version 10.3.1
frr defaults datacenter
!
interface lo
 ip address 10.10.10.3/32
exit
!
interface eth1
 ip address 10.0.1.2/30
exit
!
interface eth2
 ip address 10.10.10.1/30
exit
!
! BFD profile matching production "fabric" profile (150ms intervals).
bfd
 profile fabric
  transmit-interval 150
  receive-interval 150
  detect-multiplier 3
 exit
exit
!
router bgp 65188
 bgp router-id 10.10.10.3
 bgp cluster-id 10.10.10.3
 no bgp ebgp-requires-policy
 !
 ! ── eBGP to spine (AS 65500) ────────────────────────────────────
 neighbor 10.0.1.1 remote-as 65500
 neighbor 10.0.1.1 description spine01
 neighbor 10.0.1.1 update-source 10.0.1.2
 !
 ! ── iBGP to BOOTy (AS 65188, route-reflector client) ────────────
 neighbor 10.10.10.2 remote-as 65188
 neighbor 10.10.10.2 description booty-prod
 neighbor 10.10.10.2 update-source 10.10.10.1
 neighbor 10.10.10.2 bfd profile fabric
 neighbor 10.10.10.2 timers 30 90
 !
 address-family ipv4 unicast
  neighbor 10.0.1.1 activate
  neighbor 10.10.10.2 activate
  neighbor 10.10.10.2 route-reflector-client
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.1.1 activate
  neighbor 10.10.10.2 activate
  neighbor 10.10.10.2 route-reflector-client
  advertise-all-vni
 exit-address-family
exit
!
