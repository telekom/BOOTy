name: booty-dhcp-lab

topology:
  nodes:
    dhcp-server:
      kind: linux
      # Built by "make booty-dhcpd-test-image" from dhcpd-test.Dockerfile.
      image: booty-dhcpd-test:latest
      binds:
        - dhcpd.conf:/etc/dhcp/dhcpd.conf:ro
      # The node keeps running as PID 1. Containerlab wires eth1 after the
      # container starts, so the link setup belongs in exec, not in cmd.
      cmd: sleep infinity
      exec:
        - ip addr add 10.200.0.1/24 dev eth1
        - ip link set dev eth1 up
        # dhcpd forks into the background, so the node stays up on sleep.
        - dhcpd -cf /etc/dhcp/dhcpd.conf -pf /var/run/dhcpd.pid eth1

    booty:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:v0.5.0
      cmd: sleep infinity
      exec:
        - ip link set dev eth1 up

  links:
    - endpoints: ["dhcp-server:eth1", "booty:eth1"]
