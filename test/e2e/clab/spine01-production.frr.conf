! Spine (leaf switch) FRR config for production-realistic E2E topology.
! Simulates a leaf switch (AS 65500) peering with BOOTy via eBGP unnumbered.
!
!   eth1 → booty-prod (eBGP unnumbered)
!   eth2 → dcgw01 (eBGP, 10.0.1.1/30 ↔ 10.0.1.2/30, AS 65188)
!
frr version 10.3.1
frr defaults datacenter
!
interface lo
 ip address 10.0.0.1/32
exit
!
interface eth2
 ip address 10.0.1.1/30
exit
!
! Enable RA on unnumbered fabric link so BGP can discover link-local peer.
interface eth1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
router bgp 65500
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 ! ── Unnumbered eBGP to BOOTy (will see local-as 65501) ─────────
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor fabric bfd
 neighbor eth1 interface peer-group fabric
 !
 ! ── eBGP to DCGW/RR (AS 65188) ─────────────────────────────────
 neighbor 10.0.1.2 remote-as 65188
 neighbor 10.0.1.2 description dcgw01
 neighbor 10.0.1.2 update-source 10.0.1.1
 !
 address-family ipv4 unicast
  neighbor fabric activate
  neighbor 10.0.1.2 activate
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor fabric activate
  neighbor 10.0.1.2 activate
  advertise-all-vni
 exit-address-family
exit
!
ip prefix-list LOOPBACK seq 10 permit 10.0.0.1/32
!
route-map LOOPBACK permit 10
 match ip address prefix-list LOOPBACK
exit
!
