! spine01 — EVPN gateway for pure Type-5 e2e topology.
!
! Matches the CAPRF MR !124 fabric: Vrf_underlay + L3VNI 1000 + Type-5 only.
! Two leaves (ASN 65001, 65002) via eBGP unnumbered in Vrf_underlay.
! Overlay: default VRF with advertise ipv4 unicast → Type-5 IP prefix routes.
!
frr version 10.3.1
frr defaults datacenter
hostname spine01
log syslog informational
service integrated-vtysh-config
!
vni 1000
!
interface lo
 ip address 10.0.0.1/32
exit
!
interface eth1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
interface eth2
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
router bgp 65000 vrf Vrf_underlay
 bgp router-id 192.168.4.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 !
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor eth1 interface peer-group fabric
 neighbor eth2 interface peer-group fabric
 !
 address-family ipv4 unicast
  network 192.168.4.1/32
  neighbor fabric activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor fabric activate
  advertise-all-vni
 exit-address-family
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:1000
  route-target export 65000:1000
 exit-address-family
exit
!
end
